<script>
// Vai para a tela de verificação
function goToVerification() {
    const welcomeView = document.getElementById('welcome-view');
    const verifyView = document.getElementById('verify-view');

    if (welcomeView) welcomeView.classList.remove('active');
    if (verifyView) verifyView.classList.add('active');
}

// Volta para a tela inicial
function goToWelcome() {
    const verifyView = document.getElementById('verify-view');
    const welcomeView = document.getElementById('welcome-view');

    if (verifyView) verifyView.classList.remove('active');
    if (welcomeView) welcomeView.classList.add('active');
}

// Simula e processa a verificação com o Roblox
function startRobloxOAuth() {
    const btn = document.querySelector('.btn-roblox');
    if (btn) {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> CONNECTING...`;
    }
    
    setTimeout(() => {
        localStorage.setItem('rfo_verified', 'true');
        showMainDashboard();
    }, 1200);
}

// Mostra o painel principal
function showMainDashboard() {
    const verifyView = document.getElementById('verify-view');
    const welcomeView = document.getElementById('welcome-view');
    const mainView = document.getElementById('main-view');

    if (verifyView) verifyView.classList.remove('active');
    if (welcomeView) welcomeView.classList.remove('active');
    if (mainView) mainView.classList.add('active');
}

// Abre/Fecha o menu lateral no mobile
function toggleMenu() {
    const menuBtn = document.getElementById('menuToggle');
    const navDrawer = document.getElementById('navDrawer');
    
    if (menuBtn && navDrawer) {
        menuBtn.classList.toggle('active');
        navDrawer.classList.toggle('open');
    }
}

// Inicialização: Removemos o bloqueio automático do localStorage na inicialização 
// para garantir que você sempre consiga ver e testar a página inicial e de verificação.
window.addEventListener('DOMContentLoaded', () => {
    // Caso queira resetar o login ao abrir, basta limpar a linha de redirecionamento automático abaixo.
    // Agora o site sempre inicia na tela de boas-vindas com o botão START!
});
</script>
