<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - RFO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b1120;
            --primary-blue: #0055ff;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 85, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeInBody 0.5s ease-in-out;
        }

        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo i { color: var(--primary-blue); }

        .menu-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn:hover { background: rgba(0, 85, 255, 0.15); transform: scale(1.05); }

        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-shadow: -15px 0 40px rgba(0, 0, 0, 0.8);
        }

        .sidebar.active { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
        }

        .close-sidebar {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-sidebar:hover { color: #fff; }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .sidebar-nav a {
            color: var(--text-main);
            text-decoration: none;
            padding: 0.9rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        .sidebar-nav a:hover {
            background: rgba(0, 85, 255, 0.15);
            color: var(--accent-blue);
            border-color: var(--border-color);
            transform: translateX(4px);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 900;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active { display: block; opacity: 1; }

        main {
            flex: 1;
            padding: 2.5rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        .hero {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3.5rem 2rem;
            box-shadow: 0 0 50px rgba(0, 85, 255, 0.12);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-primary {
            display: inline-block;
            background: var(--primary-blue);
            color: #fff;
            padding: 0.9rem 2.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 85, 255, 0.4);
        }

        .btn-primary:hover {
            background: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 85, 255, 0.6);
        }

        .user-badge {
            margin-top: 1.5rem;
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(0, 85, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-shield-halved"></i> RFO Hub</div>
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Menu RFO</h3>
            <button class="close-sidebar" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-nav">
            <a href="home.html"><i class="fa-solid fa-house"></i> Início</a>
            <a href="matches.html"><i class="fa-solid fa-futbol"></i> Partidas</a>
            <a href="transmissoes.html"><i class="fa-solid fa-video"></i> Transmissões</a>
            
            <!-- Painéis liberados automaticamente se você for Admin ou Dono -->
            <a href="admin.html" id="navAdmin" style="display: none;"><i class="fa-solid fa-lock"></i> Painel Admin</a>
            <a href="dono.html" id="navDono" style="display: none;"><i class="fa-solid fa-crown"></i> Painel de Dono</a>
            
            <a href="#" onclick="logoutUser()" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.2); margin-top: 1rem;"><i class="fa-solid fa-right-from-bracket"></i> Sair / Desconectar</a>
        </div>
    </div>

    <main>
        <div class="hero">
            <h1>Painel Principal RFO</h1>
            <p>Conta verificada com sucesso via Roblox OAuth! Navegue pelas opções do menu lateral para acompanhar partidas e gerenciar a liga.</p>
            <a href="matches.html" class="btn-primary">Ver Partidas da Rodada</a>
            <div id="userInfoBadge" class="user-badge">Status: Roblox Conectado</div>
        </div>
    </main>

    <script>
        // Defina aqui os e-mails exatos que possuem cargo de Admin ou Dono
        const ADMIN_EMAILS = ["admin@rfo.com", "seu-email-aqui@gmail.com"]; 
        const DONO_EMAIL = "dono@rfo.com";   

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('rfo_roblox_verified') !== 'true') {
                window.location.href = "index.html";
                return;
            }

            // Cria partidas iniciais padrão caso o banco local esteja vazio
            if (!localStorage.getItem('rfo_matches')) {
                const initialMatches = [
                    { category: "Série A", home: "Flamengo RFO", away: "Vasco RFO", status: "Agendado" },
                    { category: "Série A", home: "Corinthians RFO", away: "Palmeiras RFO", status: "Agendado" }
                ];
                localStorage.setItem('rfo_matches', JSON.stringify(initialMatches));
            }

            // Verificação automática de permissões (sem pedir prompt de e-mail)
            // Se você já estiver logado em uma conta com permissão salva ou se configurarmos abaixo:
            let userEmail = localStorage.getItem('rfo_logged_email') || "seu-email-aqui@gmail.com"; 
            
            if (ADMIN_EMAILS.includes(userEmail) || userEmail === DONO_EMAIL) {
                document.getElementById('navAdmin').style.display = 'flex';
            }
            if (userEmail === DONO_EMAIL) {
                document.getElementById('navDono').style.display = 'flex';
            }
        });

        function logoutUser() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
