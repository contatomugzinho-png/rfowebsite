<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - RFO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b1120;
            --primary-blue: #0055ff;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 85, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeInBody 0.4s ease-in-out;
        }

        @keyframes fadeInBody { from { opacity: 0; } to { opacity: 1; } }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.2rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--primary-blue); }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-back:hover { background: rgba(0, 85, 255, 0.15); }

        main {
            flex: 1;
            padding: 2.5rem 1.5rem;
            max-width: 750px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 0 40px rgba(0, 85, 255, 0.15);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem; color: #fff; }
        h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; color: #fff; display: flex; align-items: center; gap: 8px; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group.full { grid-column: span 2; }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 0.9rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 85, 255, 0.3);
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: var(--primary-blue);
            color: #fff;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0, 85, 255, 0.4);
        }

        .btn-submit:hover {
            background: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 85, 255, 0.6);
        }

        .manage-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .manage-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-info b { color: #fff; font-size: 0.95rem; }
        .match-info span { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-delete:hover { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-lock"></i> RFO Admin</div>
        <a href="home.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </header>

    <main>
        <div class="card">
            <h1>Cadastrar Partida</h1>
            <p>Adicione os confrontos detalhados por liga, rodada, emojis do Discord e horário.</p>

            <div class="form-grid">
                <div class="form-group">
                    <label>Liga / Competição</label>
                    <select id="matchLeague">
                        <option value="Premier League">Premier League</option>
                        <option value="LA LIGA">LA LIGA</option>
                        <option value="SERIE A">SERIE A</option>
                        <option value="BUNDESLIGA">BUNDESLIGA</option>
                        <option value="LIGUE ONE">LIGUE ONE</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Rodada</label>
                    <input type="text" id="matchRound" placeholder="Ex: R3">
                </div>

                <div class="form-group">
                    <label>Mandante (Emoji Discord / Nome)</label>
                    <input type="text" id="matchHome" placeholder="Ex: <:CHE:1526260471903289527> Chelsea">
                </div>

                <div class="form-group">
                    <label>Visitante (Emoji Discord / Nome)</label>
                    <input type="text" id="matchAway" placeholder="Ex: <:LIV:1526260240042033154> Liverpool">
                </div>

                <div class="form-group full">
                    <label>Data e Horário do Jogo</label>
                    <input type="datetime-local" id="matchDateTime">
                </div>
            </div>

            <button class="btn-submit" onclick="registerMatch()">Salvar Partida</button>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-pen-to-square"></i> Gerenciar Partidas</h2>
            <p>Remova partidas cadastradas incorretamente.</p>
            <div class="manage-list" id="manageMatchesList"></div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('rfo_roblox_verified') !== 'true') {
                window.location.href = "index.html";
                return;
            }
            renderManageList();
        });

        function registerMatch() {
            const league = document.getElementById('matchLeague').value;
            const round = document.getElementById('matchRound').value.trim();
            const home = document.getElementById('matchHome').value.trim();
            const away = document.getElementById('matchAway').value.trim();
            const dateTimeVal = document.getElementById('matchDateTime').value;

            if (!round || !home || !away || !dateTimeVal) {
                alert("Por favor, preencha todos os campos!");
                return;
            }

            // Converte a data selecionada para timestamp Unix do Discord (<t:TIMESTAMP:F>)
            const dateObj = new Date(dateTimeVal);
            const unixTimestamp = Math.floor(dateObj.getTime() / 1000);

            let matches = JSON.parse(localStorage.getItem('rfo_matches')) || [];

            matches.push({
                league: league,
                round: round,
                home: home,
                away: away,
                timestamp: unixTimestamp,
                dateTimeFormatted: dateObj.toLocaleString('pt-BR')
            });

            localStorage.setItem('rfo_matches', JSON.stringify(matches));
            alert("Partida cadastrada com sucesso!");

            document.getElementById('matchRound').value = "";
            document.getElementById('matchHome').value = "";
            document.getElementById('matchAway').value = "";
            document.getElementById('matchDateTime').value = "";

            renderManageList();
        }

        function renderManageList() {
            const listContainer = document.getElementById('manageMatchesList');
            let matches = JSON.parse(localStorage.getItem('rfo_matches')) || [];

            if (matches.length === 0) {
                listContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin: 0;">Nenhuma partida cadastrada.</p>`;
                return;
            }

            listContainer.innerHTML = "";
            matches.forEach((match, index) => {
                const item = document.createElement('div');
                item.className = 'manage-item';
                item.innerHTML = `
                    <div class="match-info">
                        <b>[${match.league}] ${match.round} - ${match.home} x ${match.away}</b>
                        <span>Horário: ${match.dateTimeFormatted}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteMatch(${index})"><i class="fa-solid fa-trash"></i> Excluir</button>
                `;
                listContainer.appendChild(item);
            });
        }

        function deleteMatch(index) {
            let matches = JSON.parse(localStorage.getItem('rfo_matches')) || [];
            matches.splice(index, 1);
            localStorage.setItem('rfo_matches', JSON.stringify(matches));
            renderManageList();
        }
    </script>
</body>
</html>
