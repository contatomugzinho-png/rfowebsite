<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - RFO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b1120;
            --primary-blue: #0055ff;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 85, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeInBody 0.4s ease-in-out;
        }

        @keyframes fadeInBody { from { opacity: 0; } to { opacity: 1; } }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.2rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--primary-blue); }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-back:hover { background: rgba(0, 85, 255, 0.15); }

        main {
            flex: 1;
            padding: 2.5rem 1.5rem;
            max-width: 750px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 0 40px rgba(0, 85, 255, 0.15);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem; color: #fff; }
        h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; color: #fff; display: flex; align-items: center; gap: 8px; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            font-family: monospace;
            resize: vertical;
            transition: 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 85, 255, 0.3);
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: var(--primary-blue);
            color: #fff;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0, 85, 255, 0.4);
        }

        .btn-submit:hover {
            background: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 85, 255, 0.6);
        }

        .manage-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .manage-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-info b { color: #fff; font-size: 0.95rem; }
        .match-info span { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-delete:hover { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-lock"></i> RFO Admin</div>
        <a href="home.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </header>

    <main>
        <div class="card">
            <h1>Importar Modelo do Discord</h1>
            <p>Cole o modelo completo. Agora o parser captura os times com precisão direta.</p>

            <div class="form-group">
                <label>Modelo Bruto (Texto do Discord)</label>
                <textarea id="discordModelInput" placeholder="> # <:RFO:123> **RFO GW3**&#10;<:PL2:123> | R3 | <:CHE:123> CHE ⚔️ LIV <:LIV:123> <t:1787695200:F>"></textarea>
            </div>

            <button class="btn-submit" onclick="importDiscordModel()">Processar e Importar Partidas</button>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-pen-to-square"></i> Partidas Cadastradas</h2>
            <p>Visualize ou remova partidas já importadas.</p>
            <div class="manage-list" id="manageMatchesList"></div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('rfo_roblox_verified') !== 'true') {
                window.location.href = "index.html";
                return;
            }
            renderManageList();
        });

        function cleanString(str) {
            // Remove emojis customizados do Discord (<:NOME:ID>)
            let cleaned = str.replace(/<:[a-zA-Z0-9_]+:\d+>/g, '');
            // Deixa apenas letras maiúsculas
            cleaned = cleaned.replace(/[^a-zA-Z]/g, '').toUpperCase();
            return cleaned;
        }

        function importDiscordModel() {
            const rawText = document.getElementById('discordModelInput').value;
            if (!rawText.trim()) {
                alert("Cole o modelo do Discord na caixa de texto!");
                return;
            }

            const lines = rawText.split('\n');
            let currentLeague = "RFO Geral";
            let importedCount = 0;

            let matches = JSON.parse(localStorage.getItem('rfo_matches')) || [];

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                // 1. Identifica o campeonato (ex: **RFO GW3**)
                if (line.includes('**')) {
                    const matchLeagueName = line.match(/\*\*(.*?)\*\*/);
                    if (matchLeagueName && matchLeagueName[1]) {
                        currentLeague = matchLeagueName[1].trim();
                        continue;
                    }
                }

                // 2. Se a linha contém a espada ⚔️, é uma partida
                if (line.includes('⚔️')) {
                    // Extrai o Round (ex: R3, R1)
                    const roundMatch = line.match(/\|\s*([A-Za-z0-9]+)\s*\|/);
                    let round = roundMatch ? roundMatch[1].trim() : "R1";

                    // Extrai o Timestamp (<t:NUMEROS:F>)
                    const timeMatch = line.match(/<t:(\d+):[A-Za-z]>/);
                    const timestamp = timeMatch ? timeMatch[1] : "0";

                    // Divide a linha exatamente pelo ⚔️
                    const parts = line.split('⚔️');
                    if (parts.length >= 2) {
                        let leftSide = parts[0]; // Ex: "<:PL2:123> | R3 | <:CHE:123> CHE "
                        let rightSide = parts[1]; // Ex: " LIV <:LIV:123> <t:1787695200:F>"

                        // Pega todas as palavras/blocos de letras válidas do lado esquerdo
                        // O time da casa costuma ser a última palavra em texto puro antes da espada
                        let leftCleaned = leftSide.replace(/<:[a-zA-Z0-9_]+:\d+>/g, ' ')
                                                  .replace(/\|[^|]+\|/g, ' ') // remove o round "| R3 |"
                                                  .replace(/[^a-zA-Z]/g, ' ')
                                                  .trim()
                                                  .split(/\s+/);
                        
                        let homeTeam = leftCleaned.filter(w => w.length >= 2).pop() || "TIM";

                        // Pega o lado direito e extrai a primeira palavra válida (time visitante)
                        let rightCleaned = rightSide.replace(/<:[a-zA-Z0-9_]+:\d+>/g, ' ')
                                                    .replace(/<t:.*?>/g, ' ') // remove o timestamp
                                                    .replace(/[^a-zA-Z]/g, ' ')
                                                    .trim()
                                                    .split(/\s+/);

                        let awayTeam = rightCleaned.filter(w => w.length >= 2).shift() || "TIM";

                        matches.push({
                            league: currentLeague,
                            round: round,
                            home: homeTeam,
                            away: awayTeam,
                            timestamp: timestamp
                        });
                        importedCount++;
                    }
                }
            }

            if (importedCount > 0) {
                localStorage.setItem('rfo_matches', JSON.stringify(matches));
                alert(`Sucesso! ${importedCount} partidas importadas com os times corretos.`);
                document.getElementById('discordModelInput').value = "";
                renderManageList();
            } else {
                alert("Não foi possível extrair os times. Verifique se a linha possui o formato com '⚔️'.");
            }
        }

        function renderManageList() {
            const listContainer = document.getElementById('manageMatchesList');
            let matches = JSON.parse(localStorage.getItem('rfo_matches')) || [];

            if (matches.length === 0) {
                listContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin: 0;">Nenhuma partida cadastrada.</p>`;
                return;
            }

            listContainer.innerHTML = "";
            matches.forEach((match, index) => {
                const item = document.createElement('div');
                item.className = 'manage-item';
                item.innerHTML = `
                    <div class="match-info">
                        <b>[${match.league}] ${match.round} - ${match.home} x ${match.away}</b>
                        <span>Timestamp: &lt;t:${match.timestamp}:F&gt;</span>
                    </div>
                    <button class="btn-delete" onclick="deleteMatch(${index})"><i class="fa-solid fa-trash"></i> Excluir</button>
                `;
                listContainer.appendChild(item);
            });
        }

        function deleteMatch(index) {
            let matches = JSON.parse(localStorage.getItem('rfo_matches')) || [];
            matches.splice(index, 1);
            localStorage.setItem('rfo_matches', JSON.stringify(matches));
            renderManageList();
        }
    </script>
</body>
</html>
