<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidas - RFO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b1120;
            --primary-blue: #0055ff;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 85, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeInBody 0.4s ease-in-out;
        }

        @keyframes fadeInBody { from { opacity: 0; } to { opacity: 1; } }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.2rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--primary-blue); }

        .menu-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }

        main {
            flex: 1;
            padding: 2rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem; color: #fff; }
        p { color: var(--text-muted); margin-bottom: 2rem; }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 85, 255, 0.08);
            transition: transform 0.2s ease;
        }

        .match-card:hover { transform: translateY(-2px); }

        .teams { font-weight: 700; font-size: 1.1rem; color: #fff; }
        .category { font-size: 0.8rem; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-futbol"></i> RFO Partidas</div>
        <a href="home.html" class="menu-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </header>

    <main>
        <h1>Partidas da Liga</h1>
        <p>Confira os confrontos agendados e em andamento.</p>

        <div id="matchesContainer">
            <!-- As partidas serão carregadas dinamicamente aqui -->
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('rfo_roblox_verified') !== 'true') {
                window.location.href = "index.html";
                return;
            }

            loadMatches();
        });

        function loadMatches() {
            const container = document.getElementById('matchesContainer');
            let matches = JSON.parse(localStorage.getItem('rfo_matches')) || [];

            if (matches.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted);">Nenhuma partida cadastrada no momento.</p>`;
                return;
            }

            container.innerHTML = "";
            matches.forEach(m => {
                container.innerHTML += `
                    <div class="match-card">
                        <div>
                            <div class="category">${m.category}</div>
                            <div class="teams">${m.home} vs ${m.away}</div>
                        </div>
                        <div style="font-size: 0.85rem; padding: 0.4rem 0.8rem; background: rgba(0,85,255,0.1); border-radius: 8px; color: var(--accent-blue);">
                            ${m.status || 'Agendado'}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
