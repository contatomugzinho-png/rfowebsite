<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação - RFO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b1120;
            --primary-blue: #0055ff;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 85, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 85, 255, 0.15);
        }

        .logo-icon {
            font-size: 3rem;
            color: var(--primary-blue);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn-start {
            display: block;
            width: 100%;
            background: var(--primary-blue);
            color: #fff;
            padding: 0.9rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(0, 85, 255, 0.4);
        }

        .btn-start:hover {
            background: var(--accent-blue);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-icon"><i class="fa-solid fa-shield-halayed"></i></div>
        <h1>RFO Security</h1>
        <p id="statusText">Faça a verificação da sua conta do Roblox para acessar o sistema de gerenciamento da liga.</p>
        
        <button class="btn-start" id="startBtn" onclick="handleStartAction()">Start</button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            checkVerificationStatus();
        });

        function checkVerificationStatus() {
            const isVerified = localStorage.getItem('rfo_roblox_verified') === 'true';
            const btn = document.getElementById('startBtn');
            const statusText = document.getElementById('statusText');

            if (isVerified) {
                statusText.innerText = "Sua conta do Roblox já está verificada com sucesso! Clique em Start para entrar.";
                btn.innerText = "Start (Entrar)";
            } else {
                statusText.innerText = "Clique em Start para iniciar o processo de verificação da sua conta do Roblox.";
                btn.innerText = "Start (Verificar)";
            }
        }

        function handleStartAction() {
            const isVerified = localStorage.getItem('rfo_roblox_verified') === 'true';

            if (isVerified) {
                // Já verificado: vai para a página inicial de navegação
                window.location.href = "home.html";
            } else {
                // Simulação do fluxo de verificação do Roblox
                // Aqui você pode integrar o redirecionamento OAuth real do Roblox se desejar
                let robloxUser = prompt("Digite seu nome de usuário ou ID do Roblox para verificar:");
                if (robloxUser && robloxUser.trim() !== "") {
                    localStorage.setItem('rfo_roblox_verified', 'true');
                    localStorage.setItem('rfo_roblox_user', robloxUser.trim());
                    alert("Verificação realizada com sucesso!");
                    window.location.href = "home.html";
                } else {
                    alert("Verificação cancelada ou usuário inválido.");
                }
            }
        }
    </script>
</body>
</html>
