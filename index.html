<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação Roblox - RFO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b1120;
            --primary-blue: #0055ff;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 85, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 85, 255, 0.15) 0%, rgba(3, 7, 18, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulseGlow 6s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 85, 255, 0.15);
            animation: fadeInCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            backdrop-filter: blur(10px);
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-icon {
            font-size: 3.5rem;
            color: var(--primary-blue);
            margin-bottom: 1.2rem;
            animation: bounceIcon 3s ease-in-out infinite;
        }

        @keyframes bounceIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            color: #fff;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn-start {
            display: block;
            width: 100%;
            background: var(--primary-blue);
            color: #fff;
            padding: 1rem;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 85, 255, 0.4);
        }

        .btn-start:hover {
            background: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 85, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h1>RFO Roblox Auth</h1>
        <p id="statusText">Conecte sua conta oficial do Roblox para liberar o acesso ao sistema da liga.</p>
        
        <button class="btn-start" id="startBtn" onclick="handleRobloxAuth()">Start</button>
    </div>

    <script>
        // SEU CLIENT ID DO ROBLOX INSERIDO AQUI
        const ROBLOX_CLIENT_ID = "8591019059703884174"; 
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        window.addEventListener('DOMContentLoaded', () => {
            handleOAuthCallback();
            checkVerificationStatus();
        });

        function handleOAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                localStorage.setItem('rfo_roblox_verified', 'true');
                localStorage.setItem('rfo_roblox_code', code);
                window.history.replaceState({}, document.title, window.location.pathname);
                window.location.href = "home.html";
            }
        }

        function checkVerificationStatus() {
            const isVerified = localStorage.getItem('rfo_roblox_verified') === 'true';
            const btn = document.getElementById('startBtn');
            const statusText = document.getElementById('statusText');

            if (isVerified) {
                statusText.innerText = "Sua conta do Roblox já está verificada! Clique em Start para entrar no painel.";
                btn.innerText = "Start (Entrar)";
            } else {
                statusText.innerText = "Clique em Start para fazer login com a sua conta do Roblox.";
                btn.innerText = "Start (Verificar Roblox)";
            }
        }

        function handleRobloxAuth() {
            const isVerified = localStorage.getItem('rfo_roblox_verified') === 'true';

            if (isVerified) {
                window.location.href = "home.html";
            } else {
                // Redirecionamento oficial para o OAuth do Roblox
                const robloxOAuthUrl = `https://apis.roblox.com/oauth/v1/authorize?client_id=${ROBLOX_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=openid+profile`;
                window.location.href = robloxOAuthUrl;
            }
        }
    </script>
</body>
</html>
