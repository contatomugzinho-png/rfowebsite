<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Verification | RFO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0b1120;
            --primary-blue: #0055ff;
            --accent-blue: #3b82f6;
            --neon-glow: rgba(0, 85, 255, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-green: #10b981;
            --danger-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .verify-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid rgba(0, 85, 255, 0.3);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 85, 255, 0.25);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 12px var(--primary-blue));
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 0.4rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
            line-height: 1.5;
        }

        .btn-roblox {
            background: #ffffff;
            color: #000000;
            width: 100%;
            padding: 0.95rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
            text-decoration: none;
            margin-top: 1rem;
        }

        .btn-roblox:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .error-msg {
            color: var(--danger-red);
            font-size: 0.8rem;
            margin-top: 1rem;
            min-height: 1.2rem;
        }

        .step-view {
            display: none;
        }
        .step-view.active {
            display: block;
        }

        .profile-card {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(0, 85, 255, 0.2);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .roblox-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            background: #1e293b;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .roblox-username {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
        }

        .roblox-id {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-confirm {
            background: var(--success-green);
            color: white;
            width: 100%;
            padding: 0.95rem;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }

        .btn-confirm:hover {
            opacity: 0.9;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--success-green);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="verify-container">

        <!-- ETAPA 1: LOGIN OFICIAL ROBLOX OAUTH2 -->
        <div id="stepLogin" class="step-view active">
            <img src="1000402018.png" alt="RFO Logo" class="logo-img">
            <h2>ROBLOX VERIFICATION</h2>
            <p class="subtitle">Verify your identity securely using Roblox's official authorization system.</p>

            <button class="btn-roblox" onclick="redirectToRobloxLogin()">
                <i class="fa-solid fa-shield-halved" style="color: black; font-size: 1.1rem;"></i>
                Sign in with Roblox
            </button>
            <div class="error-msg" id="loginError"></div>
        </div>

        <!-- ETAPA 2: CONFIRMAÇÃO DA CONTA -->
        <div id="stepConfirm" class="step-view">
            <img src="1000402018.png" alt="RFO Logo" class="logo-img">
            <h2>CONFIRM ACCOUNT</h2>
            <p class="subtitle">Is this your correct Roblox profile?</p>

            <div class="profile-card">
                <img id="confirmAvatar" src="" alt="Avatar" class="roblox-avatar">
                <div>
                    <div id="confirmUsername" class="roblox-username">--</div>
                    <div id="confirmId" class="roblox-id">ID: --</div>
                </div>
            </div>

            <button class="btn-confirm" onclick="finalizeVerification()">Yes, Link Account</button>
            <div class="error-msg" id="confirmError"></div>
        </div>

        <!-- ETAPA 3: SUCESSO -->
        <div id="stepSuccess" class="step-view">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2>VERIFIED SUCCESSFULLY!</h2>
            <p class="subtitle" id="successDesc">Your Roblox account has been successfully linked to your Discord profile.</p>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const discordId = urlParams.get('discordId') || "unknown_user";

        // Seu Client ID inserido aqui
        const ROBLOX_CLIENT_ID = "1789859421050070897"; 
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        let verifiedUser = {
            id: "",
            username: "",
            avatarUrl: ""
        };

        function redirectToRobloxLogin() {
            const stateValue = Math.random().toString(36).substring(7);
            localStorage.setItem('oauth_state', stateValue);
            localStorage.setItem('discord_id_temp', discordId);

            // URL oficial de autorização OAuth2 do Roblox
            const authUrl = `https://apis.roblox.com/oauth/v1/authorize?client_id=${ROBLOX_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=openid%20profile&response_type=code&state=${stateValue}`;
            
            window.location.href = authUrl;
        }

        // Quando o usuário volta do Roblox com o código de autorização
        window.addEventListener('DOMContentLoaded', async () => {
            const code = urlParams.get('code');

            if (code) {
                // Limpa o código da URL para segurança
                window.history.replaceState({}, document.title, window.location.pathname + `?discordId=${discordId}`);

                document.getElementById('stepLogin').classList.remove('active');
                document.getElementById('stepConfirm').classList.add('active');
                document.getElementById('confirmUsername').innerText = "Authenticating with Roblox...";

                try {
                    // Aqui você envia o código 'code' para a API do seu bot/servidor processar o token do Roblox
                    /*
                    const response = await fetch('https://seu-bot-api.onrender.com/api/roblox-oauth-callback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code, redirectUri: REDIRECT_URI })
                    });
                    const data = await response.json();
                    verifiedUser.id = data.sub;
                    verifiedUser.username = data.preferred_username;
                    verifiedUser.avatarUrl = data.picture;
                    */

                    // Exemplo provisório apenas para testes visuais na tela:
                    setTimeout(() => {
                        verifiedUser.id = "178985942105";
                        verifiedUser.username = "RobloxUser";
                        verifiedUser.avatarUrl = "https://tr.rbxcdn.com/3943d4fbdab33010b40eb9cc61338271/150/150/AvatarHeadshot/Png";

                        document.getElementById('confirmAvatar').src = verifiedUser.avatarUrl;
                        document.getElementById('confirmUsername').innerText = verifiedUser.username;
                        document.getElementById('confirmId').innerText = `ID: ${verifiedUser.id}`;
                    }, 800);

                } catch (err) {
                    document.getElementById('confirmError').innerText = "Failed to authenticate authorization code.";
                }
            }
        });

        async function finalizeVerification() {
            const confirmError = document.getElementById('confirmError');
            confirmError.innerText = "";

            const confirmBtn = document.querySelector('.btn-confirm');
            confirmBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> LINKING...`;

            try {
                const storedDiscordId = localStorage.getItem('discord_id_temp') || discordId;

                const payload = {
                    discordId: storedDiscordId,
                    robloxUsername: verifiedUser.username,
                    robloxId: verifiedUser.id
                };

                // Envia para a API do seu bot para salvar a verificação no banco de dados e dar o cargo no Discord
                /*
                await fetch('https://seu-bot-api.onrender.com/api/verificar-oauth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                */

                setTimeout(() => {
                    document.getElementById('stepConfirm').classList.remove('active');
                    document.getElementById('stepSuccess').classList.add('active');
                    document.getElementById('successDesc').innerText = `Account @${verifiedUser.username} successfully linked to your Discord profile!`;
                }, 1000);

            } catch (err) {
                confirmError.innerText = "Error linking account. Try again.";
                confirmBtn.innerHTML = "Yes, Link Account";
            }
        }
    </script>
</body>
</html>
